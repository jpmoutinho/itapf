name: Checks

on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Test
        run: npm test

      - name: Build packages
        run: npm run package

      - name: Check packages
        run: npm run check:packages

      - name: Lint Firefox package
        run: npm run lint:firefox
