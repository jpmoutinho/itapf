name: Release

on:
  release:
    types:
      - published

permissions:
  contents: read

jobs:
  release:
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name }}
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Check tag and manifest versions
        run: |
          chrome_version="$(node -p "require('./manifest.chrome.json').version")"
          firefox_version="$(node -p "require('./manifest.firefox.json').version")"
          test "$RELEASE_TAG" = "v$chrome_version"
          test "$chrome_version" = "$firefox_version"

      - name: Test
        run: npm test

      - name: Build packages
        run: npm run package

      - name: Check packages
        run: npm run check:packages

      - name: Lint Firefox package
        run: npm run lint:firefox

      - name: Upload release packages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${RELEASE_TAG#v}"
          gh release upload "$RELEASE_TAG" \
            "dist/itapf-chrome-$version.zip#Chrome package" \
            "dist/itapf-firefox-$version.zip#Firefox package" \
            --clobber
